<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link rel="stylesheet" type="text/css" href="style.css"/>

        <title>Reservation Hotel Room</title>
    </head>
    <body>
        <h1>Reservation Hotel Room</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend><strong>Personal Data</strong></legend>
                <label for="name">1. Name</label><br />
                <input type="text" id="name" name="name" size="20" /><br /><br />

                <label for="gender">2. Gender</label><br />
                <input type="text" id="gender" name="gender" size="20" /><br /><br />

                <label for="email">3. Email Address</label><br />
                <input type="text" id="email" name="email" size="20" /><br /><br />

                <label for="telp">4. Telp Number</label><br />
                <input type="text" id="telp" name="telp" size="20" />
            </fieldset>

            <fieldset>
                <legend><strong>Reservation Room Form</strong></legend>
                <label for="reservation_name">1. Reservation Name</label><br />
                <input type="text" id="reservation_name" name="reservation_name" size="20" /><br /><br />

                <label for="booking_date">2. Booking Date</label><br />
                <input type="text" id="booking_date" name="booking_date" /><br /><br />

                <label for="room_type">3. Room Type</label><br />
                <select id="room_type" name="room_type">
                    <option value="deluxe">Deluxe</option>
                    <option value="standard">Standard</option>
                    <option value="suite">Suite</option>
                </select><br /><br />

                <label for="bed_type">4. Bed Type</label><br />
                <select id="bed_type" name="bed_type">
                    <option value="single">Single bed</option>
                    <option value="double">Double bed</option>
                </select><br /><br />

                <label>5. Breakfast</label><br />
                <input type="radio" id="with" name="breakfast" value="with" />
                <label for="with">With Breakfast</label>
                <input type="radio" id="without" name="breakfast" value="without" />
                <label for="without">Without Breakfast</label>
            </fieldset>

            <fieldset>
                <legend><strong>Payment</strong></legend>
                <label for="checkin">1. Check in Date</label><br />
                <input type="text" id="checkin" name="checkin" /><br /><br />

                <label for="checkout">2. Check out Date</label><br />
                <input type="text" id="checkout" name="checkout" /><br /><br />

                <label for="payment">3. Payment Method</label><br />
                <select id="payment" name="payment">
                    <option value="cash">Cash</option>
                    <option value="credit">Credit Card</option>
                    <option value="transfer">Bank Transfer</option>
                </select>
            </fieldset>
            <br />
            <input type="submit" value="submit" />
        </form>
    </body>
</html>
